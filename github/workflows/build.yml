name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar projeto
        run: |
          if [ -f memoria-android.zip ]; then
            mkdir _proj && unzip -q memoria-android.zip -d _proj
            echo "DIR=_proj" >> "$GITHUB_ENV"
          else
            echo "DIR=." >> "$GITHUB_ENV"
          fi
      - name: Aceitar licenças do Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Compilar
        run: |
          cd "$DIR"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/memoria.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: memoria-apk
          path: out/memoria.apk
